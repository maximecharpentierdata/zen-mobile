name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    strategy:
      matrix:
        package: [ZenModel, ZenStore, ZenState]
    steps:
      - uses: actions/checkout@v5
      - name: Test ${{ matrix.package }}
        run: scripts/ci-run.sh swift test --package-path Packages/${{ matrix.package }}

  format:
    name: Format (swift-format)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Lint formatting
        run: scripts/ci-run.sh swift format lint --strict --recursive App/Sources Packages/*/Sources Packages/*/Tests

  app:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: scripts/ci-run.sh swiftlint lint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: >-
          scripts/ci-run.sh xcodebuild build
          -project ZenMobile.xcodeproj
          -scheme ZenMobile
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Screenshots (macOS)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Take screenshots
        run: scripts/ci-run.sh scripts/screenshots.sh shots
      - name: Publish to the ci-screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: scripts/ci-run.sh scripts/publish-screenshots.sh shots "$BRANCH"
