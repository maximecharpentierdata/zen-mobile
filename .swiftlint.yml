# Formatting is owned by swift-format; SwiftLint enforces safety and maintainability limits.
included:
  - App
  - Packages
excluded:
  - Packages/*/.build

disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - fatal_error_message

line_length:
  warning: 120
  error: 120
file_length:
  warning: 300
  error: 400
type_body_length:
  warning: 200
  error: 300
function_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 8
  error: 12
nesting:
  type_level: 2
identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
