name: ZenMobile
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ZenModel:
    path: Packages/ZenModel
  ZenStore:
    path: Packages/ZenStore
  ZenState:
    path: Packages/ZenState
  ZenWeb:
    path: Packages/ZenWeb
  ZenUI:
    path: Packages/ZenUI
targets:
  ZenMobile:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    settings:
      base:
        # Placeholder bundle id until the app name is settled (spec §7).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maximecharpentierdata.zenmobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: ZenStore
      - package: ZenState
      - package: ZenWeb
      - package: ZenUI
    scheme: {}
